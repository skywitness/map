# 推送到 main 時自動建置並發佈到 GitHub Pages
# 資料（public/data）已經在版本庫裡，這裡不跑 Python 資料管線；
# 只有網格圖磚（不進版本庫）在這裡產生，存在 actions/cache：人口密度的 1 km 網格（約 600 MB、6 萬個檔）、
# 暖化的 0.5° 網格（約 20 MB、2.4 萬個檔）、太陽能與風能的約 2 km 網格（約 9 MB、1,150 個檔）、
# 夜間燈光的約 500 m 網格（約 106 MB、2.1 萬個檔）與航運密度的約 5 km 網格（約 4.4 MB、234 個檔）
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一次部署，新的推送排隊等前一次完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 人口密度的 1 km 網格圖磚（pipeline/topics/population_density_tiles.py）：產生的程式或地圖的橘色色階
      # （tokens.ts 的 ORANGE）改了才重新產生，要下載 12 期 GHS-POP（共 5.8 GB），約 15 分鐘
      - name: 網格圖磚的快取鍵
        id: tiles-key
        run: |
          hash=$(cat pipeline/topics/population_density_tiles.py pipeline/sources/ghsl.py \
            <(sed -n '/^const ORANGE = {/,/}/p' src/theme/tokens.ts) | sha256sum | cut -c1-16)
          echo "key=density-tiles-$hash" >> "$GITHUB_OUTPUT"
      - name: 還原網格圖磚
        id: tiles
        uses: actions/cache/restore@v6
        with:
          path: public/tiles
          key: ${{ steps.tiles-key.outputs.key }}
          # 沒有完全符合的就先拿上一版：重新產生失敗時照樣有圖磚可以部署
          restore-keys: density-tiles-
      - uses: actions/setup-python@v7
        if: steps.tiles.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: 產生網格圖磚
        id: build-tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        # JRC 的伺服器連不上時不擋部署：用上一版的圖磚（連上一版都沒有時，網站上的網格會顯示載入失敗）
        continue-on-error: true
        # 下載卡住時不要拖住整個部署（正常約 15 分鐘）
        timeout-minutes: 60
        env:
          GHSL_PRUNE: '1' # 讀完一期就刪掉下載的原始檔，磁碟才夠
        run: |
          pip install "numpy>=2" "rasterio>=1.4"
          python pipeline/run.py population-density-tiles
      - name: 存下網格圖磚
        if: steps.tiles.outputs.cache-hit != 'true' && steps.build-tiles.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: public/tiles
          key: ${{ steps.tiles-key.outputs.key }}
      # 暖化的 0.5° 網格圖磚（pipeline/topics/temperature_grid_tiles.py，放在 public/tiles/warming）：
      # 產生的程式、CRU TS 的讀取、分級門檻（temperature.ts 的 WARMING_THRESHOLDS）或地圖的發散色（tokens.ts 的
      # ORANGE、AQUA）改了才重新產生，要下載 CRU TS 的月均溫（約 165 MB），約 5 分鐘。
      # 排在人口圖磚存進快取之後，人口的快取（整個 public/tiles）才不會連暖化的一起存
      - name: 暖化網格圖磚的快取鍵
        id: warming-key
        run: |
          hash=$(cat pipeline/topics/temperature_grid_tiles.py pipeline/sources/cru.py pipeline/topics/population_density_tiles.py \
            <(sed -n '/^const ORANGE = {/,/}/p;/^const AQUA = /p;/^  diverging: \[ORANGE/p' src/theme/tokens.ts) \
            <(grep '^const WARMING_THRESHOLDS' src/topics/temperature.ts) | sha256sum | cut -c1-16)
          echo "key=warming-tiles-$hash" >> "$GITHUB_OUTPUT"
      - name: 還原暖化網格圖磚
        id: warming
        uses: actions/cache/restore@v6
        with:
          path: public/tiles/warming
          key: ${{ steps.warming-key.outputs.key }}
          restore-keys: warming-tiles-
      - uses: actions/setup-python@v7
        if: steps.warming.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: 產生暖化網格圖磚
        id: build-warming
        if: steps.warming.outputs.cache-hit != 'true'
        # CRU 的伺服器連不上時不擋部署：用上一版的圖磚（連上一版都沒有時，網站上的網格會顯示載入失敗）
        continue-on-error: true
        timeout-minutes: 30
        # 圖磚程式只用 numpy（CRU TS 讀 ASCII 版）；rasterio 是因為重用了人口圖磚程式的 PNG 編碼
        run: |
          pip install "numpy>=2" "rasterio>=1.4"
          python pipeline/run.py temperature-grid-tiles
      - name: 存下暖化網格圖磚
        if: steps.warming.outputs.cache-hit != 'true' && steps.build-warming.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: public/tiles/warming
          key: ${{ steps.warming-key.outputs.key }}
      # 太陽能與風能潛力的約 2 km 網格圖磚（pipeline/topics/renewables_grid_tiles.py，放在
      # public/tiles/renewables-solar、renewables-wind）：產生的程式、兩份資料的讀取、分級門檻（renewables.ts 的
      # SOLAR_THRESHOLDS、WIND_THRESHOLDS）或地圖的橘色色階（tokens.ts 的 ORANGE）改了才重新產生。
      # 要下載 Global Solar Atlas 的 PVOUT（345 MB）與 Global Wind Atlas 檔案裡 0.02° 的縮小版（182 MB，HTTP Range），約 3 分鐘。
      # 排在人口圖磚存進快取之後，人口的快取（整個 public/tiles）才不會連這兩個一起存
      - name: 太陽能與風能網格圖磚的快取鍵
        id: renewables-key
        run: |
          hash=$(cat pipeline/topics/renewables_grid_tiles.py pipeline/sources/gsa.py pipeline/sources/gwa.py \
            pipeline/topics/population_density_tiles.py \
            <(sed -n '/^const ORANGE = {/,/}/p' src/theme/tokens.ts) \
            <(grep -E '^const (SOLAR|WIND)_THRESHOLDS' src/topics/renewables.ts) | sha256sum | cut -c1-16)
          echo "key=renewables-tiles-$hash" >> "$GITHUB_OUTPUT"
      - name: 還原太陽能與風能網格圖磚
        id: renewables
        uses: actions/cache/restore@v6
        with:
          path: |
            public/tiles/renewables-solar
            public/tiles/renewables-wind
          key: ${{ steps.renewables-key.outputs.key }}
          restore-keys: renewables-tiles-
      - uses: actions/setup-python@v7
        if: steps.renewables.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: 產生太陽能與風能網格圖磚
        id: build-renewables
        if: steps.renewables.outputs.cache-hit != 'true'
        # Global Solar Atlas 或 DTU 的伺服器連不上時不擋部署：用上一版的圖磚（連上一版都沒有時，網站上的網格會顯示載入失敗）
        continue-on-error: true
        timeout-minutes: 30
        # numpy 做重新取樣；rasterio 讀 GeoTIFF（含 GDAL 的 /vsisparse/）並重用人口圖磚程式的 PNG 編碼
        run: |
          pip install "numpy>=2" "rasterio>=1.4"
          python pipeline/run.py renewables-grid-tiles
      - name: 存下太陽能與風能網格圖磚
        if: steps.renewables.outputs.cache-hit != 'true' && steps.build-renewables.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            public/tiles/renewables-solar
            public/tiles/renewables-wind
          key: ${{ steps.renewables-key.outputs.key }}
      # 夜間燈光的約 500 m 網格圖磚（pipeline/topics/night_lights_tiles.py，放在 public/tiles/night-lights）：
      # 產生的程式、VNL 的讀取（sources/vnl.py）、人口圖磚程式（重用它的重新取樣與 PNG 編碼）、分級門檻
      # （night-lights.ts 的 LIGHT_THRESHOLDS）或顏色（tokens.ts 的 NIGHT）改了才重新產生。
      # 要從 Zenodo 下載 4 年的 VIIRS 夜間燈光（共約 270 MB，慢的時候每條連線只有約 25 KB/s，分段平行下載），4 期同時算；第一次部署整個步驟約 3.5 分鐘。
      # 排在人口圖磚存進快取之後，人口的快取（整個 public/tiles）才不會連這個一起存
      - name: 夜間燈光網格圖磚的快取鍵
        id: lights-key
        run: |
          hash=$(cat pipeline/topics/night_lights_tiles.py pipeline/sources/vnl.py pipeline/topics/population_density_tiles.py             <(sed -n '/^const NIGHT = {/,/}/p' src/theme/tokens.ts)             <(grep '^export const LIGHT_THRESHOLDS' src/topics/night-lights.ts) | sha256sum | cut -c1-16)
          echo "key=night-lights-tiles-$hash" >> "$GITHUB_OUTPUT"
      - name: 還原夜間燈光網格圖磚
        id: lights
        uses: actions/cache/restore@v6
        with:
          path: public/tiles/night-lights
          key: ${{ steps.lights-key.outputs.key }}
          restore-keys: night-lights-tiles-
      - uses: actions/setup-python@v7
        if: steps.lights.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: 產生夜間燈光網格圖磚
        id: build-lights
        if: steps.lights.outputs.cache-hit != 'true'
        # Zenodo 連不上或太慢時不擋部署：用上一版的圖磚（連上一版都沒有時，網站上的網格會顯示載入失敗）
        continue-on-error: true
        timeout-minutes: 45
        env:
          VNL_PRUNE: '1' # 算完一期就刪掉下載的 GeoTIFF
        run: |
          pip install "numpy>=2" "rasterio>=1.4"
          python pipeline/run.py night-lights-tiles
      - name: 存下夜間燈光網格圖磚
        if: steps.lights.outputs.cache-hit != 'true' && steps.build-lights.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: public/tiles/night-lights
          key: ${{ steps.lights-key.outputs.key }}
      # 航運密度的約 5 km 網格圖磚（pipeline/topics/shipping_density_tiles.py，放在 public/tiles/ship-density）：
      # 產生的程式、資料的讀取（sources/ship_density.py）、人口圖磚程式（重用它的 PNG 編碼）、分級門檻
      # （shipping.ts 的 TRAFFIC_THRESHOLDS、TRAFFIC_MIN）或地圖的橘色色階（tokens.ts 的 ORANGE）改了才重新產生。
      # 要從世界銀行下載 Global Shipping Traffic Density（535 MB 的 zip），解壓成 9.8 GB 的 GeoTIFF（讀完就刪）再平均。
      # 第一次部署用 GDAL 的 /vsizip/ 直接讀，這一步花了 36 分鐘；改成先解壓之後約 1.5 分鐘（解壓 23 秒）。
      # 排在人口圖磚存進快取之後，人口的快取（整個 public/tiles）才不會連這個一起存
      - name: 航運密度網格圖磚的快取鍵
        id: ships-key
        run: |
          hash=$(cat pipeline/topics/shipping_density_tiles.py pipeline/sources/ship_density.py pipeline/topics/population_density_tiles.py             <(sed -n '/^const ORANGE = {/,/}/p' src/theme/tokens.ts)             <(grep -E '^(export )?const TRAFFIC_(THRESHOLDS|MIN)' src/topics/shipping.ts) | sha256sum | cut -c1-16)
          echo "key=ship-density-tiles-$hash" >> "$GITHUB_OUTPUT"
      - name: 還原航運密度網格圖磚
        id: ships
        uses: actions/cache/restore@v6
        with:
          path: public/tiles/ship-density
          key: ${{ steps.ships-key.outputs.key }}
          restore-keys: ship-density-tiles-
      - uses: actions/setup-python@v7
        if: steps.ships.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: 產生航運密度網格圖磚
        id: build-ships
        if: steps.ships.outputs.cache-hit != 'true'
        # 世界銀行的伺服器連不上時不擋部署：用上一版的圖磚（連上一版都沒有時，網站上的網格會顯示載入失敗）
        continue-on-error: true
        timeout-minutes: 40
        run: |
          pip install "numpy>=2" "rasterio>=1.4"
          python pipeline/run.py shipping-density-tiles
      - name: 存下航運密度網格圖磚
        if: steps.ships.outputs.cache-hit != 'true' && steps.build-ships.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: public/tiles/ship-density
          key: ${{ steps.ships-key.outputs.key }}
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
