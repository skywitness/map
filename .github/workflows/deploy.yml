# 推送到 main 時自動建置並發佈到 GitHub Pages
# 資料（public/data）已經在版本庫裡，這裡不跑 Python 資料管線；
# 只有網格圖磚（不進版本庫）在這裡產生，存在 actions/cache：人口密度的 1 km 網格（約 600 MB、6 萬個檔）
# 與暖化的 0.5° 網格（約 20 MB、2.4 萬個檔）
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一次部署，新的推送排隊等前一次完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 人口密度的 1 km 網格圖磚（pipeline/topics/population_density_tiles.py）：產生的程式或地圖的橘色色階
      # （tokens.ts 的 ORANGE）改了才重新產生，要下載 12 期 GHS-POP（共 5.8 GB），約 15 分鐘
      - name: 網格圖磚的快取鍵
        id: tiles-key
        run: |
          hash=$(cat pipeline/topics/population_density_tiles.py pipeline/sources/ghsl.py \
            <(sed -n '/^const ORANGE = {/,/}/p' src/theme/tokens.ts) | sha256sum | cut -c1-16)
          echo "key=density-tiles-$hash" >> "$GITHUB_OUTPUT"
      - name: 還原網格圖磚
        id: tiles
        uses: actions/cache/restore@v6
        with:
          path: public/tiles
          key: ${{ steps.tiles-key.outputs.key }}
          # 沒有完全符合的就先拿上一版：重新產生失敗時照樣有圖磚可以部署
          restore-keys: density-tiles-
      - uses: actions/setup-python@v7
        if: steps.tiles.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: 產生網格圖磚
        id: build-tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        # JRC 的伺服器連不上時不擋部署：用上一版的圖磚（連上一版都沒有時，網站上的網格會顯示載入失敗）
        continue-on-error: true
        # 下載卡住時不要拖住整個部署（正常約 15 分鐘）
        timeout-minutes: 60
        env:
          GHSL_PRUNE: '1' # 讀完一期就刪掉下載的原始檔，磁碟才夠
        run: |
          pip install "numpy>=2" "rasterio>=1.4"
          python pipeline/run.py population-density-tiles
      - name: 存下網格圖磚
        if: steps.tiles.outputs.cache-hit != 'true' && steps.build-tiles.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: public/tiles
          key: ${{ steps.tiles-key.outputs.key }}
      # 暖化的 0.5° 網格圖磚（pipeline/topics/temperature_grid_tiles.py，放在 public/tiles/warming）：
      # 產生的程式、CRU TS 的讀取、分級門檻（temperature.ts 的 WARMING_THRESHOLDS）或地圖的發散色（tokens.ts 的
      # ORANGE、AQUA）改了才重新產生，要下載 CRU TS 的月均溫（約 165 MB），約 5 分鐘。
      # 排在人口圖磚存進快取之後，人口的快取（整個 public/tiles）才不會連暖化的一起存
      - name: 暖化網格圖磚的快取鍵
        id: warming-key
        run: |
          hash=$(cat pipeline/topics/temperature_grid_tiles.py pipeline/sources/cru.py pipeline/topics/population_density_tiles.py \
            <(sed -n '/^const ORANGE = {/,/}/p;/^const AQUA = /p;/^  diverging: \[ORANGE/p' src/theme/tokens.ts) \
            <(grep '^const WARMING_THRESHOLDS' src/topics/temperature.ts) | sha256sum | cut -c1-16)
          echo "key=warming-tiles-$hash" >> "$GITHUB_OUTPUT"
      - name: 還原暖化網格圖磚
        id: warming
        uses: actions/cache/restore@v6
        with:
          path: public/tiles/warming
          key: ${{ steps.warming-key.outputs.key }}
          restore-keys: warming-tiles-
      - uses: actions/setup-python@v7
        if: steps.warming.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: 產生暖化網格圖磚
        id: build-warming
        if: steps.warming.outputs.cache-hit != 'true'
        # CRU 的伺服器連不上時不擋部署：用上一版的圖磚（連上一版都沒有時，網站上的網格會顯示載入失敗）
        continue-on-error: true
        timeout-minutes: 30
        # 圖磚程式只用 numpy（CRU TS 讀 ASCII 版）；rasterio 是因為重用了人口圖磚程式的 PNG 編碼
        run: |
          pip install "numpy>=2" "rasterio>=1.4"
          python pipeline/run.py temperature-grid-tiles
      - name: 存下暖化網格圖磚
        if: steps.warming.outputs.cache-hit != 'true' && steps.build-warming.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: public/tiles/warming
          key: ${{ steps.warming-key.outputs.key }}
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
